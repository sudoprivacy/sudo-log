name: sudo-log-prod

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: sudo-log-prod-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: sudo_log
      CLICKHOUSE_USER: sudo
      CLICKHOUSE_PASSWORD: Sudodata-123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok" ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - sudo-log-network

  redis:
    image: redis:7-alpine
    container_name: sudo-log-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - sudo-log-network

  postgres:
    image: postgres:16-alpine
    container_name: sudo-log-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sudo_log
      POSTGRES_USER: sudo
      POSTGRES_PASSWORD: Sudodata-123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sudo -d sudo_log" ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - sudo-log-network

  sudo-log:
    image: ghcr.io/sudo-ai/sudo-log:latest
    container_name: sudo-log-prod
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    volumes:
      - sudo-log-blobs:/data/sudo-log/blobs
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - sudo-log-network

  grafana:
    image: grafana/grafana-oss:latest
    container_name: sudo-log-prod-grafana
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Sudodata-123
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://logs.example.com/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LIVE_ALLOWED_ORIGINS: https://logs.example.com
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      GRAFANA_CLICKHOUSE_DATABASE: sudo_log_grafana
      GRAFANA_CLICKHOUSE_USER: grafana_reader
      GRAFANA_CLICKHOUSE_PASSWORD: Sudodata-123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - sudo-log-network

volumes:
  clickhouse-data:
    name: sudo-log-prod-clickhouse-data
  clickhouse-logs:
    name: sudo-log-prod-clickhouse-logs
  redis-data:
    name: sudo-log-prod-redis-data
  postgres-data:
    name: sudo-log-prod-postgres-data
  sudo-log-blobs:
    name: sudo-log-prod-blobs
  grafana-data:
    name: sudo-log-prod-grafana-data

networks:
  sudo-log-network:
    name: sudo-log-prod-network
    driver: bridge
